<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>whosit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a3320;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      background: #1a3320;
    }
    #nameOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      touch-action: auto;
      -webkit-user-select: text;
      user-select: text;
    }
    #nameOverlay.show { display: flex; }
    #nameOverlay input {
      font-size: 18px;
      padding: 14px 16px;
      border-radius: 10px;
      border: 2px solid #2a5a3a;
      background: #1a3320;
      color: #fff;
      width: min(80vw, 300px);
      outline: none;
      text-align: center;
    }
    #nameOverlay .row {
      display: flex;
      gap: 10px;
    }
    #nameOverlay button {
      font-size: 16px;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    #nameOverlay .ok { background: #2a5a3a; color: #c8e8c8; }
    #nameOverlay .cancel { background: #333; color: #aaa; }
    #nameOverlay .del { background: #6a2a2a; color: #f0c0c0; display: none; }
    #nameOverlay.editing .del { display: inline-block; }
    #bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      height: 56px;
      background: #0f2214;
      border-top: 1px solid #1a3a24;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      touch-action: auto;
    }
    #bar .fields {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    #bar label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #a8d0b0;
      font: 13px system-ui, sans-serif;
      white-space: nowrap;
    }
    #bar select {
      appearance: none;
      -webkit-appearance: none;
      background: #1a3320;
      color: #c8e8c8;
      border: 1px solid #2a5a3a;
      border-radius: 8px;
      padding: 8px 22px 8px 10px;
      font: 15px system-ui, sans-serif;
      outline: none;
    }
    #goBtn {
      flex: 0 0 auto;
      min-width: 72px;
      height: 40px;
      border: none;
      border-radius: 8px;
      background: #2a5a3a;
      color: #c8e8c8;
      font: bold 16px system-ui, sans-serif;
      cursor: pointer;
    }
    #goBtn:disabled {
      background: #3a3a3a;
      color: #888;
      cursor: default;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="nameOverlay">
    <input id="nameInput" type="text" maxlength="12" placeholder="Name" enterkeyhint="done" autocomplete="off" autocorrect="off" />
    <div class="row">
      <button type="button" class="cancel" id="nameCancel">Cancel</button>
      <button type="button" class="del" id="nameDel">Delete</button>
      <button type="button" class="ok" id="nameOk">Save</button>
    </div>
  </div>
  <div id="bar">
    <div class="fields">
      <label>Teams
        <select id="teamN"></select>
      </label>
      <label>Each
        <select id="eachN"></select>
      </label>
    </div>
    <button type="button" id="goBtn">GO</button>
  </div>
  <script src="whosit.js?v=1.0"></script>
  <script data-goatcounter="https://justbobonx.goatcounter.com/count"
        async
        src="https://gc.zgo.at/count.v5.js?v=0.8"
        crossorigin="anonymous"
        integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ"></script>
  </body>
</body>
</html>
